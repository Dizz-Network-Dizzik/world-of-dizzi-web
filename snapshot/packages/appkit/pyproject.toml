[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dizz-appkit"
version = "1.24.1"
description = "appkit — geteilte Kern-Bibliothek des Dizz-Netzwerk-App-Vertrags (K3)"
requires-python = ">=3.12"

# Flat-Layout: das Paket 'appkit' liegt direkt in diesem Verzeichnis (packages/appkit).
# Editable install beim Cutover: pip install -e packages/appkit  -> ein appkit netzweit.
[tool.setuptools]
packages = ["appkit", "appkit.tests"]
package-dir = { "appkit" = ".", "appkit.tests" = "tests" }
