<!doctype html>
<html lang="de" data-design="metall" data-farbe="cyan-magenta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Anti-FOUC (K2.2): zuletzt gewähltes Theme/Schema sofort aus localStorage,
         bevor das CSS greift; der Server-Stand wird in App.tsx nachgezogen. -->
    <script>
      (function () {
        try {
          var d = localStorage.getItem("dizzi_design"), f = localStorage.getItem("dizzi_farbe");
          if (d) document.documentElement.setAttribute("data-design", d);
          if (f) document.documentElement.setAttribute("data-farbe", f);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>the world of dizzi</title>
    <!-- DzHalter — Float-Andock-Schale (Spin-Physik v4.4): Core serviert beide
         Dateien über seine /ui-kit-Whitelist; FloatingSettings dockt daran an. -->
    <link rel="stylesheet" href="/ui-kit/float_dock.css" />
    <script defer src="/ui-kit/float_dock.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
