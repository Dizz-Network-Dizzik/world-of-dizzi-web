<svg viewBox="0 0 680 726" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif">
<title>Dizz Trading — System-Architektur</title>
<desc>Schichten-Karte des Trading Bots: Markt/Regime-Erkennung schreibt eine Bridge-Datei, freqtrade-Bots fuehren aus, die KI-Lern-Ebene lernt aus den Trades und verdichtet eine Ensemble-Politik, der Autopilot wendet validierte Gewinner gegated an; Risiko- und Aussen-/Netz-Schichten greifen quer.</desc>
<style>
  .bg{fill:#0e1116}
  .th{fill:#e6edf3;font-size:14px;font-weight:600}
  .ti{fill:#e6edf3;font-size:15px;font-weight:700}
  .ts{fill:#9aa7b4;font-size:12px}
  .zt{fill:#cdd7e1;font-size:14px;font-weight:600}
  .arr{stroke:#8b98a8;stroke-width:1.6;fill:none}
  .dash{stroke:#3a4757;stroke-width:1;stroke-dasharray:5 5;fill:none}
  .z-teal{fill:#0f2e2b;stroke:#2dd4bf;stroke-width:1.5}
  .z-blue{fill:#11233f;stroke:#60a5fa;stroke-width:1.5}
  .z-purple{fill:#241433;stroke:#c084fc;stroke-width:1.5}
  .z-amber{fill:#2e2410;stroke:#fbbf24;stroke-width:1.5}
  .z-coral{fill:#2e1620;stroke:#fb7185;stroke-width:1.5}
  .z-green{fill:#0f2e1c;stroke:#4ade80;stroke-width:1.5}
  .z-gray{fill:#1b2130;stroke:#64748b;stroke-width:1.5}
</style>
<rect class="bg" x="0" y="0" width="680" height="726"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8b98a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="ti" x="40" y="24">Dizz Trading — System-Architektur</text>
<text class="ts" x="40" y="42">34 Bots + 6 MN-Paper (dry_run) · KI-Lern-Ensemble · jede autonome Aktion gegated · R1–R10 verifiziert</text>

<text class="zt" x="40" y="66">① Markt &amp; Regime-Erkennung</text>
<rect class="z-teal" x="40" y="74" width="140" height="44" rx="7"/><text class="th" x="110" y="96" text-anchor="middle">ccxt / Bitget</text><text class="ts" x="110" y="110" text-anchor="middle">OHLCV read-only</text>
<rect class="z-teal" x="193" y="74" width="140" height="44" rx="7"/><text class="th" x="263" y="96" text-anchor="middle">tracker.py</text><text class="ts" x="263" y="110" text-anchor="middle">Markt-Snapshot, Regime</text>
<rect class="z-teal" x="346" y="74" width="140" height="44" rx="7"/><text class="th" x="416" y="96" text-anchor="middle">hmm.py</text><text class="ts" x="416" y="110" text-anchor="middle">Gauss-HMM, kausal</text>
<rect class="z-teal" x="499" y="74" width="140" height="44" rx="7"/><text class="th" x="569" y="96" text-anchor="middle">fundamental.py</text><text class="ts" x="569" y="110" text-anchor="middle">Event-Risiko, fail-safe</text>

<line class="arr" x1="340" y1="120" x2="340" y2="133" marker-end="url(#arrow)"/><text class="ts" x="348" y="130">schreibt</text>

<rect class="z-gray" x="40" y="135" width="599" height="38" rx="7"/><text class="th" x="339" y="152" text-anchor="middle">Bridge — data/hmm_regime.json (venv-übergreifend)</text><text class="ts" x="339" y="166" text-anchor="middle">regime · Konfidenz · lev_scale · exposure_scale</text>

<line class="arr" x1="340" y1="175" x2="340" y2="188" marker-end="url(#arrow)"/><text class="ts" x="348" y="185">liest live</text>

<text class="zt" x="40" y="204">② Ausführung — freqtrade (je Bot ein Prozess)</text>
<rect class="z-blue" x="40" y="212" width="140" height="44" rx="7"/><text class="th" x="110" y="234" text-anchor="middle">12 Engines</text><text class="ts" x="110" y="248" text-anchor="middle">Spot + Futures-Short</text>
<rect class="z-blue" x="193" y="212" width="140" height="44" rx="7"/><text class="th" x="263" y="234" text-anchor="middle">MasterMeta-Bot</text><text class="ts" x="263" y="248" text-anchor="middle">regime-schaltend, Hebel</text>
<rect class="z-blue" x="346" y="212" width="140" height="44" rx="7"/><text class="th" x="416" y="234" text-anchor="middle">runner.py</text><text class="ts" x="416" y="248" text-anchor="middle">Prozesse, sicherer Kill</text>
<rect class="z-blue" x="499" y="212" width="140" height="44" rx="7"/><text class="th" x="569" y="234" text-anchor="middle">registry.py</text><text class="ts" x="569" y="248" text-anchor="middle">bots.json, Configs</text>
<text class="ts" x="40" y="270">↳ 34 Bots dry_run (jede Strategie ≥1) → tradesv3_*.sqlite (Backend liest read-only, kann nie korrumpieren)</text>

<line class="arr" x1="340" y1="278" x2="340" y2="291" marker-end="url(#arrow)"/><text class="ts" x="348" y="288">Trades (read-only)</text>

<text class="zt" x="40" y="307">③ KI-Lernen — das Gehirn (proposal-only, OOS-gegated)</text>
<rect class="z-purple" x="40" y="315" width="140" height="44" rx="7"/><text class="th" x="110" y="337" text-anchor="middle">stats.py</text><text class="ts" x="110" y="351" text-anchor="middle">Lern-DB, Trade-Reads</text>
<rect class="z-purple" x="193" y="315" width="140" height="44" rx="7"/><text class="th" x="263" y="337" text-anchor="middle">meta + mn_learn</text><text class="ts" x="263" y="351" text-anchor="middle">Walk-Forward, OOS-Gate</text>
<rect class="z-purple" x="346" y="315" width="140" height="44" rx="7"/><text class="th" x="416" y="337" text-anchor="middle">MN-Sockel</text><text class="ts" x="416" y="351" text-anchor="middle">CSM/Pairs/MM (Sim)</text>
<rect class="z-purple" x="499" y="315" width="140" height="44" rx="7"/><text class="th" x="569" y="337" text-anchor="middle">master.py</text><text class="ts" x="569" y="351" text-anchor="middle">Ensemble-Politik</text>

<line class="arr" x1="340" y1="361" x2="340" y2="374" marker-end="url(#arrow)"/><text class="ts" x="348" y="371">Evidenz + Politik</text>

<text class="zt" x="40" y="390">④ Autopilot — alle 6 h, risk-first, exception-isoliert</text>
<rect class="z-amber" x="40" y="398" width="112" height="44" rx="7"/><text class="th" x="96" y="420" text-anchor="middle">governor</text><text class="ts" x="96" y="434" text-anchor="middle">de-risk</text>
<rect class="z-amber" x="162" y="398" width="112" height="44" rx="7"/><text class="th" x="218" y="420" text-anchor="middle">improve</text><text class="ts" x="218" y="434" text-anchor="middle">Master-Tuning</text>
<rect class="z-amber" x="284" y="398" width="112" height="44" rx="7"/><text class="th" x="340" y="420" text-anchor="middle">Auto-Upgrade</text><text class="ts" x="340" y="434" text-anchor="middle">OOS+TF+opt-in</text>
<rect class="z-amber" x="406" y="398" width="112" height="44" rx="7"/><text class="th" x="462" y="420" text-anchor="middle">cull</text><text class="ts" x="462" y="434" text-anchor="middle">Dauer-Verlierer</text>
<rect class="z-amber" x="528" y="398" width="112" height="44" rx="7"/><text class="th" x="584" y="420" text-anchor="middle">Auto-Validate</text><text class="ts" x="584" y="434" text-anchor="middle">proposal-only</text>
<text class="ts" x="40" y="458">↺ Rückkopplung: Auto-Upgrade → Bots ② (MERGE + Neustart) · governor → Bots pausieren · master → Bridge (Hebel/Exposure)</text>

<line class="dash" x1="40" y1="472" x2="640" y2="472"/>
<text class="zt" x="40" y="492">Quer- &amp; Außen-Schichten — greifen über alle Ebenen</text>

<text class="zt" x="40" y="514">⑤ Risiko — kann Risiko nur senken</text>
<rect class="z-coral" x="40" y="522" width="140" height="44" rx="7"/><text class="th" x="110" y="544" text-anchor="middle">risk.py</text><text class="ts" x="110" y="558" text-anchor="middle">Hard-Limits, kill_switch</text>
<rect class="z-coral" x="193" y="522" width="140" height="44" rx="7"/><text class="th" x="263" y="544" text-anchor="middle">concentration</text><text class="ts" x="263" y="558" text-anchor="middle">Klumpen (read-only)</text>
<rect class="z-coral" x="346" y="522" width="140" height="44" rx="7"/><text class="th" x="416" y="544" text-anchor="middle">execution</text><text class="ts" x="416" y="558" text-anchor="middle">Slippage (M6-Prep)</text>

<text class="zt" x="40" y="588">⑥ Außen / Netz / Sicherheit</text>
<rect class="z-green" x="40" y="596" width="140" height="44" rx="7"/><text class="th" x="110" y="618" text-anchor="middle">vertrag / appkit</text><text class="ts" x="110" y="632" text-anchor="middle">SSO·Vault·CSP·HITL</text>
<rect class="z-green" x="193" y="596" width="140" height="44" rx="7"/><text class="th" x="263" y="618" text-anchor="middle">mcp_tools</text><text class="ts" x="263" y="632" text-anchor="middle">6 read-only Tools</text>
<rect class="z-green" x="346" y="596" width="140" height="44" rx="7"/><text class="th" x="416" y="618" text-anchor="middle">report (V11)</text><text class="ts" x="416" y="632" text-anchor="middle">→ Memory (HITL)</text>
<rect class="z-green" x="499" y="596" width="140" height="44" rx="7"/><text class="th" x="569" y="618" text-anchor="middle">transfer</text><text class="ts" x="569" y="632" text-anchor="middle">Echtgeld-Gate, blockiert</text>

<rect class="z-gray" x="40" y="656" width="599" height="42" rx="7"/><text class="th" x="339" y="674" text-anchor="middle">Kern-Prinzip</text><text class="ts" x="339" y="689" text-anchor="middle">Jede autonome Aktion ist proposal-only · defensiv · oder hart OOS/opt-in-gegated — nichts erhöht autonom das Risiko.</text>
</svg>
